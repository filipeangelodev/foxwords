<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fox Words</title>
    <link rel="icon" type="image/png" href="assets/images/favicon-32x32.png">
    <link rel="stylesheet" href="assets/css/main.css">
    <script>
        const foxWordsData = JSON.parse(localStorage.getItem('fox_words_data'));
        if( !foxWordsData.theme ){
            window.location.href = 'index.html';
        }
    </script>
</head>
<body>
    
    <div id="content-app" class="text-center">
        <header id="header-app" class="w-100 mb-auto">
            <nav class="navbar navbar-expand-lg py-4">
                <div class="container-fluid">
                    <a href="index.html" aria-label="Voltar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left preview-icon"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                    </a>
                    <h1 class="title text-center"><span class="text-primary">Fox</span>Words</h1>
                    <button class="btn btn-sm btn-outline-secondary d-flex align-items-center justify-content-center" data-fox-words-status="restart">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-rotate-ccw preview-icon"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    </button>
                </div>
            </nav>
        </header>
    
        <main id="main-app" class="w-100">
            <div class="container">
                <div class="badge badge-theme-name w-100 bg-bege text-secondary py-3">
                    <p>Tema</p>
                    <p class="the-theme"><strong>Tecnologia</strong></p>   
                </div>
                <ul class="the-words">
                    <!-- load js -->
                </ul>
                <p class="letters-lenght mb-3">8 letras</p>
                <button type="button" class="btn btn-primary d-none" data-fox-words-status="init">Novo jogo</button>
                <div class="alert alert-danger d-none" role="alert">
                    Ops! Não foi dessa vez! 😅 <br>Tente outra letra e chegue mais perto da palavra secreta!
                </div>
            </div>
        </main>

        <footer id="footer-app" class="w-100 mt-auto py-4">
            <div class="container">
                <div class="keyboard is-game">
                    <div class="keyboard__line">
                        <button type="button" class="btn" data-target-letter="q">q</button>
                        <button type="button" class="btn" data-target-letter="w">w</button>
                        <button type="button" class="btn" data-target-letter="e">e</button>
                        <button type="button" class="btn" data-target-letter="r">r</button>
                        <button type="button" class="btn" data-target-letter="t">t</button>
                        <button type="button" class="btn" data-target-letter="y">y</button>
                        <button type="button" class="btn" data-target-letter="u">u</button>
                        <button type="button" class="btn" data-target-letter="i">i</button>
                        <button type="button" class="btn" data-target-letter="o">o</button>
                        <button type="button" class="btn" data-target-letter="p">p</button>
                    </div>
                    <div class="keyboard__line">
                        <button type="button" class="btn" data-target-letter="a">a</button>
                        <button type="button" class="btn" data-target-letter="s">s</button>
                        <button type="button" class="btn" data-target-letter="d">d</button>
                        <button type="button" class="btn" data-target-letter="f">f</button>
                        <button type="button" class="btn" data-target-letter="g">g</button>
                        <button type="button" class="btn" data-target-letter="h">h</button>
                        <button type="button" class="btn" data-target-letter="j">j</button>
                        <button type="button" class="btn" data-target-letter="k">k</button>
                        <button type="button" class="btn" data-target-letter="l">l</button>
                    </div>
                    <div class="keyboard__line">
                        <button type="button" class="btn" data-target-letter="z">z</button>
                        <button type="button" class="btn" data-target-letter="x">x</button>
                        <button type="button" class="btn" data-target-letter="c">c</button>
                        <button type="button" class="btn" data-target-letter="v">v</button>
                        <button type="button" class="btn" data-target-letter="b">b</button>
                        <button type="button" class="btn" data-target-letter="n">n</button>
                        <button type="button" class="btn" data-target-letter="m">m</button>
                    </div>
                </div>
                <div class="mt-5">
                    <button type="button" class="btn btn-primary w-100 palpitar" data-bs-toggle="modal" data-bs-target="#modalToThrobGame">Palpitar</button>
                </div>
            </div>
        </footer>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="modalToThrobGame" tabindex="-1" aria-labelledby="modalToThrobGameLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <h3>Já sabe?</h3>
                    <p>Diga a palavra</p>
                    <form class="form-palpite form-default" action="">
                        <div class="mb-3">
                            <input type="text" class="form-control" id="field-theme" name="palpite-temp" placeholder="Digite o palpite" readonly>
                            <input type="hidden" name="palpite" value="">
                        </div>
                        <div class="keyboard">
                            <div class="keyboard__line">
                                <button type="button" class="btn" data-target-letter="q">q</button>
                                <button type="button" class="btn" data-target-letter="w">w</button>
                                <button type="button" class="btn" data-target-letter="e">e</button>
                                <button type="button" class="btn" data-target-letter="r">r</button>
                                <button type="button" class="btn" data-target-letter="t">t</button>
                                <button type="button" class="btn" data-target-letter="y">y</button>
                                <button type="button" class="btn" data-target-letter="u">u</button>
                                <button type="button" class="btn" data-target-letter="i">i</button>
                                <button type="button" class="btn" data-target-letter="o">o</button>
                                <button type="button" class="btn" data-target-letter="p">p</button>
                            </div>
                            <div class="keyboard__line">
                                <button type="button" class="btn" data-target-letter="a">a</button>
                                <button type="button" class="btn" data-target-letter="s">s</button>
                                <button type="button" class="btn" data-target-letter="d">d</button>
                                <button type="button" class="btn" data-target-letter="f">f</button>
                                <button type="button" class="btn" data-target-letter="g">g</button>
                                <button type="button" class="btn" data-target-letter="h">h</button>
                                <button type="button" class="btn" data-target-letter="j">j</button>
                                <button type="button" class="btn" data-target-letter="k">k</button>
                                <button type="button" class="btn" data-target-letter="l">l</button>
                            </div>
                            <div class="keyboard__line">
                                <button type="button" class="btn" data-target-letter="z">z</button>
                                <button type="button" class="btn" data-target-letter="x">x</button>
                                <button type="button" class="btn" data-target-letter="c">c</button>
                                <button type="button" class="btn" data-target-letter="v">v</button>
                                <button type="button" class="btn" data-target-letter="b">b</button>
                                <button type="button" class="btn" data-target-letter="n">n</button>
                                <button type="button" class="btn" data-target-letter="m">m</button>
                                <button type="button" class="btn btn-backspace">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-delete preview-icon"><path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m12 9 6 6"/><path d="m18 9-6 6"/></svg>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-sm btn-primary w-100">Palpitar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/js/script.js"></script>

</body>
</html>
